<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card glass-card p-4" style="width: 100%; max-width: 440px;">
        <div class="text-center mb-4">
            <h4 style="color: #8B1E28;" class="fw-bold">I. MUNICIPALIDAD DE LA SERENA</h4>
            <h6 class="text-muted">Recuperación de Acceso Institucional</h6>
        </div>
        
        <form id="recoverForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">RUT del Funcionario *</label>
                <input type="text" class="form-control" id="rut" placeholder="12345678-9" required>
                <div class="invalid-feedback">Ingrese un RUT válido con guion.</div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Correo Institucional *</label>
                <input type="email" class="form-control" id="email" placeholder="usuario@laserena.cl" required>
                <div class="invalid-feedback">Ingrese un correo institucional válido.</div>
            </div>

            <button type="submit" class="btn btn-muni w-100 py-2 mb-3">Enviar Enlace de Recuperación</button>
            <div class="text-center">
                <a href="index.html" class="text-decoration-none small text-secondary">← Volver al Inicio de Sesión</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function validaRut(rutCompleto) {
            if (!/^[0-9]+-[0-9kK]{1}$/.test(rutCompleto)) return false;
            let tmp = rutCompleto.split('-');
            let digv = tmp[1].toLowerCase(); 
            let rut = tmp[0];
            if (digv == 'k') digv = 10;
            let M = 0, S = 1;
            for (; rut; rut = Math.floor(rut / 10))
                S = (S + rut % 10 * (9 - M++ % 6)) % 11;
            return true;
        }

        document.getElementById('recoverForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const rutInput = document.getElementById('rut');
            const emailInput = document.getElementById('email');
            let esValido = true;

            if (!validaRut(rutInput.value)) {
                rutInput.classList.add('is-invalid');
                esValido = false;
            } else {
                rutInput.classList.remove('is-invalid');
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                emailInput.classList.add('is-invalid');
                esValido = false;
            } else {
                emailInput.classList.remove('is-invalid');
            }

            if (esValido) {
                Swal.fire({
                    title: '¡Solicitud Enviada!',
                    text: 'Se han enviado las instrucciones de restablecimiento al correo ingresado.',
                    icon: 'success',
                    confirmButtonColor: '#8B1E28',
                    confirmButtonText: 'Entendido'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            }
        });
    </script>
</body>
</html>
