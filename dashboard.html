<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Territorial - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        .table-custom th { background-color: #343a40; color: white; }
    </style>
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- CONTENEDOR DEL NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <!-- Contenido Principal -->
    <div class="container mt-4 mb-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <h3 style="color: #8B1E28;">Listado de Atenciones Registradas</h3>
                <p class="text-muted mb-0">Monitoreo de atención ciudadana y espacios públicos en La Serena.</p>
            </div>
            <div class="col-md-5 text-end d-flex justify-content-end gap-2">
                <button class="btn btn-outline-secondary" onclick="cargarAtencionesBD()">
                    🔄 Refrescar
                </button>
                <button class="btn text-white" style="background-color: #8B1E28;" onclick="abrirModalNuevaAtencion()">
                    + Nueva Atención
                </button>
            </div>
        </div>

        <div class="card glass-card p-3 shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover table-bordered table-custom align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RUT Vecino</th>
                            <th>Nombre Solicitante</th>
                            <th>Tipo / Sub Atención</th>
                            <th>Delegación</th>
                            <th>Responsable</th>
                            <th>Fecha</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAtencionesBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted py-3">Cargando datos desde la base de datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        const opcionesSubTipo = {
            'Social': ['Caja de Alimentos', 'Subsidio Agua Potable', 'Ficha Protección Social', 'Asistencia Familiar'],
            'Territorial': ['Operativos de Limpieza', 'Reunión Junta de Vecinos', 'Jardines y Áreas Verdes'],
            'Operativa': ['Reparación Luminarias', 'Bacheo de Calles', 'Retiro de Escombros', 'Fumigación']
        };

        document.addEventListener('DOMContentLoaded', () => {
            cargarAtencionesBD();
        });

        async function cargarAtencionesBD() {
            const tbody = document.getElementById('tablaAtencionesBody');
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-3">Actualizando datos...</td></tr>';
            
            try {
                const response = await fetch(`${API}/atenciones`, { credentials: 'include' });
                const json = await response.json();
                
                tbody.innerHTML = '';
                
                if (json.success) {
                    const data = json.datos;
                    
                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No hay atenciones registradas en la base de datos.</td></tr>';
                        return;
                    }

                    data.forEach(atencion => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><b>#${atencion.id_atencion}</b></td>
                            <td>${atencion.rut || 'S/R'}</td>
                            <td>${atencion.solicitante || 'Sin Nombre'}</td>
                            <td><strong>${atencion.tipo_atencion || ''}</strong><br><small class="text-muted">${atencion.sub_atencion || ''}</small></td>
                            <td>${atencion.delegacion || ''}</td>
                            <td>${atencion.usuario_responsable || 'Sistema'}</td>
                            <td>${atencion.fecha_registro || 'N/A'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-secondary" onclick="verDetalle(${atencion.id_atencion}, '${atencion.descripcion || ''}')">Ver Detalle</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger py-4 fw-bold">Error: ${json.message}</td></tr>`;
                }
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4 fw-bold">Error al conectar con la base de datos. Verifica que Node.js esté encendido.</td></tr>';
            }
        }

        function formatearRUT(rut) {
            if (!rut) return '';
            let valor = rut.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length < 2) return valor;
            let cuerpo = valor.slice(0, -1);
            let dv = valor.slice(-1);
            return `${cuerpo}-${dv}`;
        }

        function actualizarSubTipos() {
            const tipo = document.getElementById('sw-at-tipo').value;
            const selectSub = document.getElementById('sw-at-sub');
            selectSub.innerHTML = '';
            
            if (opcionesSubTipo[tipo]) {
                opcionesSubTipo[tipo].forEach(sub => {
                    selectSub.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            }
        }

        function abrirModalNuevaAtencion() {
            const sessionUser = JSON.parse(localStorage.getItem('sgr_user') || sessionStorage.getItem('sgr_user')) || { 
                nombre: 'Usuario Operador', 
                delegacion: 'Sector Centro' 
            };

            const delegacionAsignada = sessionUser.delegacion || 'Sector Centro';

            Swal.fire({
                title: 'Ingreso de Atención',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label class="fw-bold mb-1">RUT Vecino / Solicitante *</label>
                                <input id="sw-at-rut" class="form-control" placeholder="12345678-9" onblur="this.value = formatearRUT(this.value)">
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1">Nombre Solicitante <small class="text-muted fw-normal">(Opcional)</small></label>
                                <input id="sw-at-solicitante" class="form-control" placeholder="Ej: Juan Pérez Soto">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label class="fw-bold mb-1">Delegación de atención</label>
                                <input class="form-control bg-light" value="${delegacionAsignada} [Asignada por perfil]" readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1">Tipo de Atención *</label>
                                <select id="sw-at-tipo" class="form-select" onchange="actualizarSubTipos()">
                                    <option value="Social">Social</option>
                                    <option value="Territorial">Territorial</option>
                                    <option value="Operativa">Operativa</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="fw-bold mb-1">Sub Atención *</label>
                            <select id="sw-at-sub" class="form-select">
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold mb-1">Descripción de la atención *</label>
                            <textarea id="sw-at-desc" class="form-control" rows="3" placeholder="Describa la solicitud y los antecedentes necesarios..."></textarea>
                        </div>

                        <div class="p-2 bg-light rounded text-muted" style="font-size: 0.8rem;">
                            <strong>Responsable:</strong> ${sessionUser.nombre || sessionUser.nombre_usuario} | <strong>Fecha y hora:</strong> Automáticas
                        </div>
                    </div>
                `,
                width: '650px',
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar atención',
                cancelButtonText: 'Cancelar',
                didOpen: () => {
                    actualizarSubTipos();
                },
                preConfirm: () => {
                    let rutInput = document.getElementById('sw-at-rut').value.trim();
                    let solicitante = document.getElementById('sw-at-solicitante').value.trim();
                    const tipo = document.getElementById('sw-at-tipo').value;
                    const sub = document.getElementById('sw-at-sub').value;
                    const descripcion = document.getElementById('sw-at-desc').value.trim();

                    rutInput = formatearRUT(rutInput);
                    document.getElementById('sw-at-rut').value = rutInput;

                    const regexRut = /^[0-9]{7,8}-[0-9kK]{1}$/;
                    if (!rutInput || !regexRut.test(rutInput)) {
                        Swal.showValidationMessage('Ingrese un RUT válido de vecino (Ej: 12345678-9).');
                        return false;
                    }

                    if (!descripcion) {
                        Swal.showValidationMessage('Por favor ingresa la Descripción de la atención.');
                        return false;
                    }

                    if (!solicitante) {
                        solicitante = 'Vecino No Registrado';
                    }

                    return {
                        rut: rutInput,
                        solicitante: solicitante,
                        delegacion: delegacionAsignada,
                        usuario_responsable: sessionUser.nombre || sessionUser.nombre_usuario || 'Operador',
                        tipo_atencion: tipo,
                        sub_atencion: sub,
                        descripcion: descripcion,
                        estado: 'PENDIENTE'
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`${API}/atenciones`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify(result.value)
                        });
                        const json = await response.json();
                        if (json.success) {
                            Swal.fire('¡Registrado!', 'La atención ha sido guardada en MySQL.', 'success');
                            cargarAtencionesBD();
                        } else {
                            Swal.fire('Error MySQL', json.message || 'No se pudo guardar la atención.', 'error');
                        }
                    } catch (e) {
                        Swal.fire('Error', 'No se pudo conectar con la API de Node.js.', 'error');
                    }
                }
            });
        }

        function verDetalle(id, descripcion) {
            Swal.fire({
                title: `Detalle de Atención #${id}`,
                text: descripcion || 'Sin descripción ingresada.',
                icon: 'info',
                confirmButtonColor: '#8B1E28'
            });
        }
    </script>
</body>
</html>
