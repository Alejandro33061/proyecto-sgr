<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub Atención - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 style="color: #8B1E28;" class="m-0 fw-bold">Sub Atención</h3>
                <p class="text-muted m-0">Administración de sub-categorías asociadas a Tipos de Atención.</p>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-5">
                    <input type="text" id="busquedaSub" class="form-control" placeholder="Buscar por nombre, código o tipo..." oninput="filtrarSubAtenciones(1)">
                </div>
                <div class="col-md-3">
                    <select id="filtroEstadoSub" class="form-select" onchange="filtrarSubAtenciones(1)">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-success w-100" onclick="exportarExcelSubAtenciones()">
                        Exportar Excel
                    </button>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn text-white w-100" style="background-color: #8B1E28;" onclick="modalNuevaSubAtencion()">
                        + Nuevo registro
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Tipo asociado</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodySubAtenciones">
                        <tr><td colspan="5" class="text-center">Cargando sub-atenciones...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- PIE DE PAGINACIÓN -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="text-muted small fw-bold" id="infoPaginacionSub">
                    Mostrando 0 a 0 de 0 registros
                </div>
                <nav aria-label="Navegación de páginas">
                    <ul class="pagination pagination-sm m-0" id="paginadorSub">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let listaSubAtenciones = [];
        let listaTiposPadre = [];
        let paginaActual = 1;
        const limitePorPagina = 5;

        document.addEventListener('DOMContentLoaded', async () => {
            fetch('navbar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('navbar-container').innerHTML = html;
                    marcarBotonActivo();
                    sincronizarSesionYNavbar();
                });

            await cargarTiposPadre();
            cargarSubAtencionesBD(1);
        });

        function marcarBotonActivo() {
            let pag = window.location.pathname.split("/").pop();
            if (!pag || pag === '') pag = 'sub-atenciones.html';

            const enlaces = document.querySelectorAll('#navPublicMenu .nav-link-item');
            enlaces.forEach(enlace => {
                if (enlace.getAttribute('href') === pag) {
                    enlace.classList.add('activo-fijo');
                } else {
                    enlace.classList.remove('activo-fijo');
                }
            });
        }

        async function sincronizarSesionYNavbar() {
            try {
                const response = await fetch(`${API}/sesion-actual?t=${new Date().getTime()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.usuario) {
                        const usr = data.usuario;
                        localStorage.setItem('sgr_user', JSON.stringify(usr));

                        const elNombre = document.getElementById('usrHeaderNombre');
                        const elRol = document.getElementById('usrHeaderRol');
                        if (elNombre) elNombre.textContent = usr.nombre || usr.nombre_usuario;
                        if (elRol) elRol.textContent = usr.rol;
                    }
                }
            } catch (error) {
                console.error('Error al sincronizar sesión:', error);
            }
        }

        async function cargarTiposPadre() {
            try {
                const res = await fetch(`${API}/tipos-atencion`, { credentials: 'include' });
                const json = await res.json();
                if (json.success) listaTiposPadre = json.datos;
            } catch (e) { console.error(e); }
        }

        async function cargarSubAtencionesBD(pagina = 1) {
            paginaActual = pagina;
            try {
                const response = await fetch(`${API}/sub-atenciones`, { credentials: 'include' });
                const json = await response.json();
                if (json.success) {
                    // Ordenamiento por el número del código (SAT-0101, SAT-0102, SAT-0201, etc.)
                    listaSubAtenciones = json.datos.sort((a, b) => {
                        const numA = parseInt((a.codigo ? a.codigo.match(/\d+/) : [0]) || [0], 10);
                        const numB = parseInt((b.codigo ? b.codigo.match(/\d+/) : [0]) || [0], 10);
                        return numA - numB;
                    });
                    filtrarSubAtenciones(paginaActual);
                }
            } catch (error) { console.error(error); }
        }

        function filtrarSubAtenciones(pagina = 1) {
            paginaActual = pagina;
            const texto = document.getElementById('busquedaSub').value.toLowerCase();
            const estado = document.getElementById('filtroEstadoSub').value;

            const filtrados = listaSubAtenciones.filter(sa => {
                const coincideTexto = sa.nombre.toLowerCase().includes(texto) || sa.codigo.toLowerCase().includes(texto) || (sa.tipo_asociado || '').toLowerCase().includes(texto);
                const coincideEstado = estado === '' || sa.estado === estado;
                return coincideTexto && coincideEstado;
            });

            const totalRegistros = filtrados.length;
            const totalPaginas = Math.ceil(totalRegistros / limitePorPagina) || 1;
            
            const inicio = (paginaActual - 1) * limitePorPagina;
            const fin = inicio + limitePorPagina;
            const datosPagina = filtrados.slice(inicio, fin);

            renderTablaSubAtenciones(datosPagina);
            renderizarPaginador(totalRegistros, totalPaginas, totalRegistros > 0 ? inicio + 1 : 0, Math.min(fin, totalRegistros));
        }

        function renderTablaSubAtenciones(datos) {
            const tbody = document.getElementById('tbodySubAtenciones');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay sub-atenciones registradas.</td></tr>';
                return;
            }

            datos.forEach(sa => {
                const idReal = sa.id_sub || sa.id_sub_atencion;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${sa.codigo}</strong></td>
                    <td>${sa.nombre}</td>
                    <td><span class="badge bg-info text-dark">${sa.tipo_asociado || 'General'}</span></td>
                    <td><span class="badge ${sa.estado === 'ACTIVO' ? 'bg-success' : 'bg-secondary'}">${sa.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="modalEditarSubAtencion(${idReal})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarSubAtencion(${idReal})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarPaginador(totalRegistros, totalPaginas, desde, hasta) {
            const infoText = document.getElementById('infoPaginacionSub');
            const ulPaginador = document.getElementById('paginadorSub');

            if (totalRegistros === 0) {
                infoText.textContent = 'Mostrando 0 a 0 de 0 registros';
                ulPaginador.innerHTML = '';
                return;
            } else {
                infoText.textContent = `Mostrando ${desde} a ${hasta} de ${totalRegistros} registros`;
            }

            ulPaginador.innerHTML = '';

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarSubAtenciones(${paginaActual - 1})">Anterior</button>
                </li>
            `;

            for (let i = 1; i <= totalPaginas; i++) {
                ulPaginador.innerHTML += `
                    <li class="page-item ${i === paginaActual ? 'active' : ''}">
                        <button class="page-link" ${i === paginaActual ? 'style="background-color: #8B1E28; border-color: #8B1E28;"' : ''} onclick="filtrarSubAtenciones(${i})">${i}</button>
                    </li>
                `;
            }

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarSubAtenciones(${paginaActual + 1})">Siguiente</button>
                </li>
            `;
        }

        function modalNuevaSubAtencion() {
            let opcionesTipos = listaTiposPadre.map(t => `<option value="${t.id_tipo || t.id_tipo_atencion}">${t.nombre}</option>`).join('');

            Swal.fire({
                title: 'Nueva Sub Atención',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código (Opcional - Autogenerado)</label>
                            <input id="sw-sa-codigo" class="form-control" placeholder="Ej: SAT-0104 (Dejar vacío para automático)">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre Sub Atención *</label>
                            <input id="sw-sa-nombre" class="form-control" placeholder="Ej: Ayuda social, Beca municipal">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Tipo de Atención Asociado *</label>
                            <select id="sw-sa-tipo" class="form-select">
                                ${opcionesTipos}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-sa-est" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar',
                preConfirm: () => {
                    const codigoInput = document.getElementById('sw-sa-codigo').value.trim();
                    const nombre = document.getElementById('sw-sa-nombre').value.trim();
                    if (!nombre) {
                        Swal.showValidationMessage('El Nombre es obligatorio.');
                        return false;
                    }
                    return {
                        codigo: codigoInput,
                        nombre,
                        id_tipo_atencion: document.getElementById('sw-sa-tipo').value,
                        estado: document.getElementById('sw-sa-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/sub-atenciones`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Guardado!', `Sub Atención agregada (${json.codigo}).`, 'success');
                        cargarSubAtencionesBD(paginaActual);
                    } else {
                        Swal.fire('Error', json.message, 'error');
                    }
                }
            });
        }

        function modalEditarSubAtencion(id) {
            const sa = listaSubAtenciones.find(item => (item.id_sub || item.id_sub_atencion) === id);
            if (!sa) return;

            let opcionesTipos = listaTiposPadre.map(t => {
                const idPadre = t.id_tipo || t.id_tipo_atencion;
                return `<option value="${idPadre}" ${t.nombre === sa.tipo_asociado ? 'selected' : ''}>${t.nombre}</option>`;
            }).join('');

            Swal.fire({
                title: `Editar Sub Atención #${id}`,
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-edit-sa-codigo" class="form-control" value="${sa.codigo}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-edit-sa-nombre" class="form-control" value="${sa.nombre}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Tipo Asociado *</label>
                            <select id="sw-edit-sa-tipo" class="form-select">
                                ${opcionesTipos}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-edit-sa-est" class="form-select">
                                <option value="ACTIVO" ${sa.estado === 'ACTIVO' ? 'selected' : ''}>ACTIVO</option>
                                <option value="INACTIVO" ${sa.estado === 'INACTIVO' ? 'selected' : ''}>INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Actualizar',
                preConfirm: () => {
                    const codigo = document.getElementById('sw-edit-sa-codigo').value.trim();
                    const nombre = document.getElementById('sw-edit-sa-nombre').value.trim();
                    if (!codigo || !nombre) {
                        Swal.showValidationMessage('El Código y Nombre son obligatorios.');
                        return false;
                    }
                    return {
                        codigo,
                        nombre,
                        id_tipo_atencion: document.getElementById('sw-edit-sa-tipo').value,
                        estado: document.getElementById('sw-edit-sa-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/sub-atenciones/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Actualizado!', 'Sub atención modificada.', 'success');
                        cargarSubAtencionesBD(paginaActual);
                    } else {
                        Swal.fire('Error', json.message, 'error');
                    }
                }
            });
        }

        async function eliminarSubAtencion(id) {
            Swal.fire({
                title: '¿Eliminar Sub Atención?',
                text: 'Se verificará la integridad con las atenciones antes de borrar.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Eliminar'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    const response = await fetch(`${API}/sub-atenciones/${id}`, { method: 'DELETE', credentials: 'include' });
                    const json = await response.json();
                    if (json.success) {
                        Swal.fire('¡Eliminado!', 'Sub atención removida.', 'success');
                        cargarSubAtencionesBD(paginaActual);
                    } else {
                        Swal.fire('Operación Bloqueada', json.message, 'error');
                    }
                }
            });
        }

        function exportarExcelSubAtenciones() {
            let csv = 'Codigo,Nombre,TipoAsociado,Estado\n';
            listaSubAtenciones.forEach(sa => {
                csv += `"${sa.codigo}","${sa.nombre}","${sa.tipo_asociado || ''}","${sa.estado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Sub_Atenciones.csv';
            a.click();
        }
    </script>
</body>
</html>
