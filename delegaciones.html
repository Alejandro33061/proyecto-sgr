<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor Delegaciones - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 style="color: #8B1E28;" class="m-0 fw-bold"> Delegaciones Municipales</h3>
                <p class="text-muted m-0">Administración de sedes territoriales registradas en el sistema.</p>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-5">
                    <input type="text" id="busquedaDelegacion" class="form-control" placeholder="Buscar por nombre o código..." oninput="filtrarDelegaciones()">
                </div>
                <div class="col-md-3">
                    <select id="filtroEstadoDelegacion" class="form-select" onchange="filtrarDelegaciones()">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-success w-100" onclick="exportarExcelDelegaciones()">
                        Exportar Excel
                    </button>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn text-white w-100" style="background-color: #8B1E28;" onclick="modalNuevaDelegacion()">
                        + Nuevo registro
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Comuna</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyDelegaciones">
                        <tr><td colspan="5" class="text-center">Cargando delegaciones desde MySQL...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let listaDelegaciones = [];

        document.addEventListener('DOMContentLoaded', () => {
            cargarDelegacionesBD();
        });

        async function cargarDelegacionesBD() {
            try {
                const response = await fetch(`${API}/delegaciones`, { credentials: 'include' });
                const json = await response.json();
                if (json.success) {
                    listaDelegaciones = json.datos.sort((a, b) => a.id_delegacion - b.id_delegacion);
                    renderTablaDelegaciones(listaDelegaciones);
                }
            } catch (error) { console.error(error); }
        }

        function renderTablaDelegaciones(datos) {
            const tbody = document.getElementById('tbodyDelegaciones');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay delegaciones registradas.</td></tr>';
                return;
            }

            datos.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${d.codigo}</strong></td>
                    <td>${d.nombre}</td>
                    <td>${d.comuna || 'La Serena'}</td>
                    <td><span class="badge ${d.estado === 'ACTIVO' ? 'bg-success' : 'bg-secondary'}">${d.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="modalEditarDelegacion(${d.id_delegacion})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarDelegacion(${d.id_delegacion})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarDelegaciones() {
            const texto = document.getElementById('busquedaDelegacion').value.toLowerCase();
            const estado = document.getElementById('filtroEstadoDelegacion').value;

            const filtrados = listaDelegaciones.filter(d => {
                const coincideTexto = d.nombre.toLowerCase().includes(texto) || d.codigo.toLowerCase().includes(texto);
                const coincideEstado = estado === '' || d.estado === estado;
                return coincideTexto && coincideEstado;
            });

            renderTablaDelegaciones(filtrados);
        }

        function modalNuevaDelegacion() {
            Swal.fire({
                title: 'Nueva Delegación Municipal',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-del-codigo" class="form-control" placeholder="Código de la delegación">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre Delegación *</label>
                            <input id="sw-del-nombre" class="form-control" placeholder="Nombre completo">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Dirección</label>
                            <input id="sw-del-dir" class="form-control" placeholder="Dirección física">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-del-est" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar Delegación',
                preConfirm: () => {
                    const codigo = document.getElementById('sw-del-codigo').value.trim();
                    const nombre = document.getElementById('sw-del-nombre').value.trim();
                    if (!codigo || !nombre) {
                        Swal.showValidationMessage('El Código y el Nombre son obligatorios.');
                        return false;
                    }
                    return {
                        codigo,
                        nombre,
                        direccion: document.getElementById('sw-del-dir').value.trim() || 'Sin Dirección',
                        comuna: 'La Serena',
                        estado: document.getElementById('sw-del-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/delegaciones`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Guardado!', 'Delegación guardada en MySQL.', 'success');
                        cargarDelegacionesBD();
                    }
                }
            });
        }

        function modalEditarDelegacion(id) {
            const d = listaDelegaciones.find(item => item.id_delegacion === id);
            if (!d) return;

            Swal.fire({
                title: `Editar Delegación #${id}`,
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-edit-codigo" class="form-control" value="${d.codigo}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-edit-nombre" class="form-control" value="${d.nombre}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Dirección</label>
                            <input id="sw-edit-dir" class="form-control" value="${d.direccion || ''}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-edit-est" class="form-select">
                                <option value="ACTIVO" ${d.estado === 'ACTIVO' ? 'selected' : ''}>ACTIVO</option>
                                <option value="INACTIVO" ${d.estado === 'INACTIVO' ? 'selected' : ''}>INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Actualizar',
                preConfirm: () => {
                    const codigo = document.getElementById('sw-edit-codigo').value.trim();
                    const nombre = document.getElementById('sw-edit-nombre').value.trim();
                    if (!codigo || !nombre) {
                        Swal.showValidationMessage('El Código y el Nombre son obligatorios.');
                        return false;
                    }
                    return {
                        codigo,
                        nombre,
                        direccion: document.getElementById('sw-edit-dir').value.trim() || 'Sin Dirección',
                        comuna: 'La Serena',
                        estado: document.getElementById('sw-edit-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(`${API}/delegaciones/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    Swal.fire('¡Actualizado!', 'Delegación modificada en MySQL.', 'success');
                    cargarDelegacionesBD();
                }
            });
        }

        async function eliminarDelegacion(id) {
            Swal.fire({
                title: '¿Eliminar delegación?',
                text: 'Se borra de MySQL permanentemente.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Sí, eliminar'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await fetch(`${API}/delegaciones/${id}`, { method: 'DELETE', credentials: 'include' });
                    cargarDelegacionesBD();
                }
            });
        }

        function exportarExcelDelegaciones() {
            let csv = 'Codigo,Nombre,Comuna,Estado\n';
            listaDelegaciones.forEach(d => {
                csv += `"${d.codigo}","${d.nombre}","${d.comuna || 'La Serena'}","${d.estado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Delegaciones_Municipales.csv';
            a.click();
        }
    </script>
</body>
</html>
