<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delegaciones Municipales - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 style="color: #8B1E28;" class="m-0 fw-bold">Delegaciones Municipales</h3>
                <p class="text-muted m-0">Administración de sedes territoriales registradas en el sistema.</p>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-5">
                    <input type="text" id="busquedaDelegacion" class="form-control" placeholder="Buscar por nombre o código..." oninput="filtrarDelegaciones(1)">
                </div>
                <div class="col-md-3">
                    <select id="filtroEstadoDelegacion" class="form-select" onchange="filtrarDelegaciones(1)">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-success w-100" onclick="exportarExcelDelegaciones()">
                        Exportar Excel
                    </button>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn text-white w-100" style="background-color: #8B1E28;" onclick="modalNuevaDelegacion()">
                        + Nuevo registro
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Comuna</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyDelegaciones">
                        <tr><td colspan="5" class="text-center">Cargando delegaciones...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- PIE DE PAGINACIÓN MAQUETA -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="text-muted small fw-bold" id="infoPaginacionDelegaciones">
                    Mostrando 0 a 0 de 0 registros
                </div>
                <nav aria-label="Navegación de páginas">
                    <ul class="pagination pagination-sm m-0" id="paginadorDelegaciones">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let listaDelegaciones = [];
        let paginaActual = 1;
        const limitePorPagina = 5;

        document.addEventListener('DOMContentLoaded', () => {
            fetch('navbar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('navbar-container').innerHTML = html;
                    marcarBotonActivo();
                    sincronizarSesionYNavbar();
                });

            cargarDelegacionesBD(1);
        });

        function marcarBotonActivo() {
            let pag = window.location.pathname.split("/").pop();
            if (!pag || pag === '') pag = 'delegaciones.html';

            const enlaces = document.querySelectorAll('#navPublicMenu .nav-link-item');
            enlaces.forEach(enlace => {
                if (enlace.getAttribute('href') === pag) {
                    enlace.classList.add('activo-fijo');
                } else {
                    enlace.classList.remove('activo-fijo');
                }
            });
        }

        async function sincronizarSesionYNavbar() {
            try {
                const response = await fetch(`${API}/sesion-actual?t=${new Date().getTime()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.usuario) {
                        const usr = data.usuario;
                        localStorage.setItem('sgr_user', JSON.stringify(usr));

                        const elNombre = document.getElementById('usrHeaderNombre');
                        const elRol = document.getElementById('usrHeaderRol');
                        const elDelegacion = document.getElementById('usrHeaderDelegacion');

                        if (elNombre) elNombre.textContent = usr.nombre || usr.nombre_usuario;
                        if (elRol) elRol.textContent = usr.rol;
                        if (elDelegacion) elDelegacion.textContent = usr.delegacion || 'DEL-001 | Sector Centro';
                    }
                }
            } catch (error) {
                console.error('Error al sincronizar sesión:', error);
            }
        }

        // EXTRAER EL NÚMERO DE UN CÓDIGO (Ej: DEL-002 -> 2)
        function extraerNumeroCodigo(codigo) {
            if (!codigo) return 0;
            const match = codigo.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
        }

        async function cargarDelegacionesBD(pagina = 1) {
            try {
                const response = await fetch(`${API}/delegaciones?limit=100`, { credentials: 'include' });
                const json = await response.json();
                if (json.success) {
                    // ORDENAR NUMÉRICAMENTE POR EL CÓDIGO (DEL-001, DEL-002, DEL-003, etc.)
                    listaDelegaciones = json.datos.sort((a, b) => extraerNumeroCodigo(a.codigo) - extraerNumeroCodigo(b.codigo));
                    filtrarDelegaciones(pagina);
                }
            } catch (error) { console.error(error); }
        }

        function filtrarDelegaciones(pagina = 1) {
            paginaActual = pagina;
            const texto = document.getElementById('busquedaDelegacion').value.trim().toLowerCase();
            const estado = document.getElementById('filtroEstadoDelegacion').value;

            const filtrados = listaDelegaciones.filter(d => {
                const coincideTexto = d.nombre.toLowerCase().includes(texto) || d.codigo.toLowerCase().includes(texto);
                const coincideEstado = estado === '' || d.estado === estado;
                return coincideTexto && coincideEstado;
            });

            const totalRegistros = filtrados.length;
            const totalPaginas = Math.ceil(totalRegistros / limitePorPagina) || 1;
            
            const inicio = (paginaActual - 1) * limitePorPagina;
            const fin = inicio + limitePorPagina;
            const datosPagina = filtrados.slice(inicio, fin);

            renderTablaDelegaciones(datosPagina);
            renderizarPaginador(totalRegistros, totalPaginas, totalRegistros > 0 ? inicio + 1 : 0, Math.min(fin, totalRegistros));
        }

        function renderTablaDelegaciones(datos) {
            const tbody = document.getElementById('tbodyDelegaciones');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay delegaciones registradas.</td></tr>';
                return;
            }

            datos.forEach(d => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${d.codigo}</strong></td>
                    <td>${d.nombre}</td>
                    <td>${d.comuna || 'La Serena'}</td>
                    <td><span class="badge ${d.estado === 'ACTIVO' ? 'bg-success' : 'bg-secondary'}">${d.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="modalEditarDelegacion(${d.id_delegacion})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarDelegacion(${d.id_delegacion})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarPaginador(totalRegistros, totalPaginas, desde, hasta) {
            const infoText = document.getElementById('infoPaginacionDelegaciones');
            const ulPaginador = document.getElementById('paginadorDelegaciones');

            if (totalRegistros === 0) {
                infoText.textContent = 'Mostrando 0 a 0 de 0 registros';
                ulPaginador.innerHTML = '';
                return;
            } else {
                infoText.textContent = `Mostrando ${desde} a ${hasta} de ${totalRegistros} registros`;
            }

            ulPaginador.innerHTML = '';

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarDelegaciones(${paginaActual - 1})">Anterior</button>
                </li>
            `;

            for (let i = 1; i <= totalPaginas; i++) {
                ulPaginador.innerHTML += `
                    <li class="page-item ${i === paginaActual ? 'active' : ''}">
                        <button class="page-link" ${i === paginaActual ? 'style="background-color: #8B1E28; border-color: #8B1E28;"' : ''} onclick="filtrarDelegaciones(${i})">${i}</button>
                    </li>
                `;
            }

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarDelegaciones(${paginaActual + 1})">Siguiente</button>
                </li>
            `;
        }

        function obtenerSiguienteCodigoDelegacion(lista) {
            const numerosUsados = lista
                .map(d => extraerNumeroCodigo(d.codigo))
                .filter(n => n > 0)
                .sort((a, b) => a - b);

            let siguiente = 1;
            while (numerosUsados.includes(siguiente)) {
                siguiente++;
            }

            return `DEL-${String(siguiente).padStart(3, '0')}`;
        }

        function modalNuevaDelegacion() {
            const codigoSugerido = obtenerSiguienteCodigoDelegacion(listaDelegaciones);

            Swal.fire({
                title: 'Nueva Delegación Municipal',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código (Automático)</label>
                            <input id="sw-del-codigo" class="form-control bg-light" value="${codigoSugerido}" readonly style="background-color: #e9ecef;">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-del-nombre" class="form-control" placeholder="Ej: Sector Oriente">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Dirección</label>
                            <input id="sw-del-dir" class="form-control" placeholder="Ej: Av. Balmaceda 123">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Comuna</label>
                            <input id="sw-del-comuna" class="form-control bg-light" value="La Serena" readonly disabled>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar',
                preConfirm: () => {
                    const codigo = document.getElementById('sw-del-codigo').value.trim();
                    const nombre = document.getElementById('sw-del-nombre').value.trim();
                    if (!codigo || !nombre) {
                        Swal.showValidationMessage('El Nombre es obligatorio.');
                        return false;
                    }
                    return {
                        codigo,
                        nombre,
                        direccion: document.getElementById('sw-del-dir').value.trim() || 'Prat 451',
                        comuna: 'La Serena',
                        estado: 'ACTIVO'
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(`${API}/delegaciones`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    Swal.fire('¡Guardado!', 'Delegación registrada.', 'success');
                    cargarDelegacionesBD(paginaActual);
                }
            });
        }

        function modalEditarDelegacion(id) {
            const d = listaDelegaciones.find(item => item.id_delegacion === id);
            if (!d) return;

            Swal.fire({
                title: `Editar Delegación`,
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-edit-del-codigo" class="form-control" value="${d.codigo}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-edit-del-nombre" class="form-control" value="${d.nombre}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Dirección</label>
                            <input id="sw-edit-del-dir" class="form-control" value="${d.direccion || ''}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Comuna</label>
                            <input class="form-control bg-light" value="La Serena" readonly disabled>
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-edit-del-est" class="form-select">
                                <option value="ACTIVO" ${d.estado === 'ACTIVO' ? 'selected' : ''}>ACTIVO</option>
                                <option value="INACTIVO" ${d.estado === 'INACTIVO' ? 'selected' : ''}>INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Actualizar',
                preConfirm: () => {
                    return {
                        codigo: document.getElementById('sw-edit-del-codigo').value.trim(),
                        nombre: document.getElementById('sw-edit-del-nombre').value.trim(),
                        direccion: document.getElementById('sw-edit-del-dir').value.trim(),
                        comuna: 'La Serena',
                        estado: document.getElementById('sw-edit-del-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(`${API}/delegaciones/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    Swal.fire('¡Actualizado!', 'Delegación modificada.', 'success');
                    cargarDelegacionesBD(paginaActual);
                }
            });
        }

        async function eliminarDelegacion(id) {
            Swal.fire({
                title: '¿Eliminar Delegación?',
                text: 'Se borra de MySQL.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Eliminar'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await fetch(`${API}/delegaciones/${id}`, { method: 'DELETE', credentials: 'include' });
                    cargarDelegacionesBD(paginaActual);
                }
            });
        }

        function exportarExcelDelegaciones() {
            let csv = 'Codigo,Nombre,Comuna,Estado\n';
            listaDelegaciones.forEach(d => {
                csv += `"${d.codigo}","${d.nombre}","${d.comuna || 'La Serena'}","${d.estado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Delegaciones.csv';
            a.click();
        }
    </script>
</body>
</html>
