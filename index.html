<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card glass-card p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h3 style="color: #8B1E28;" class="fw-bold">I. MUNICIPALIDAD DE LA SERENA</h3>
            <h6 class="text-muted">Gestión Territorial SGR</h6>
        </div>
        
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">RUT del Funcionario</label>
                <input type="text" class="form-control" id="rut" placeholder="12345678-9" required>
                <div class="invalid-feedback">Ingrese un RUT válido con guion.</div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
                <div class="invalid-feedback">Mínimo 8 caracteres, al menos una letra y un número.</div>
            </div>
            <div class="text-end mb-4">
                <a href="recuperar.html" class="text-decoration-none small" style="color: #8B1E28;">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-muni w-100 py-2">Acceder al Sistema</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function validaRut(rutCompleto) {
            if (!/^[0-9]+-[0-9kK]{1}$/.test(rutCompleto)) return false;
            let tmp = rutCompleto.split('-');
            let digv = tmp[1].toLowerCase(); 
            let rut = tmp[0];
            if (digv == 'k') digv = 10;
            let M = 0, S = 1;
            for (; rut; rut = Math.floor(rut / 10))
                S = (S + rut % 10 * (9 - M++ % 6)) % 11;
            return true;
        }

        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const rutInput = document.getElementById('rut');
            const passInput = document.getElementById('password');
            let esValido = true;

            if (!validaRut(rutInput.value)) {
                rutInput.classList.add('is-invalid');
                esValido = false;
            } else {
                rutInput.classList.remove('is-invalid');
            }

            const passRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
            if (!passRegex.test(passInput.value)) {
                passInput.classList.add('is-invalid');
                esValido = false;
            } else {
                passInput.classList.remove('is-invalid');
            }

            if (esValido) {
                Swal.fire({
                    title: '¡Bienvenido!',
                    text: 'Sesión iniciada correctamente en el sistema SGR.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'dashboard.html';
                });
            }
        });
    </script>
</body>
</html>
