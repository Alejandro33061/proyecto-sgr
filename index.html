<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card glass-card p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h4 style="color: #8B1E28;" class="fw-bold">I. MUNICIPALIDAD DE LA SERENA</h4>
            <p class="text-muted small">Sistema de Gestión de Requerimientos (SGR)</p>
        </div>

        <form id="formLogin" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario o Correo *</label>
                <input type="text" class="form-control" id="loginUsuario" placeholder="admin@laserena.cl" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña *</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="******" required>
            </div>

            <button type="submit" class="btn btn-muni w-100 py-2 mb-3">Iniciar Sesión</button>

            <div class="text-center">
                <a href="recuperar.html" class="text-decoration-none small" style="color: #8B1E28;">¿Olvidó su contraseña?</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!usuario || !password) {
                Swal.fire({
                    title: 'Campos requeridos',
                    text: 'Ingrese su usuario y contraseña.',
                    icon: 'warning',
                    confirmButtonColor: '#8B1E28'
                });
                return;
            }

            try {
                const response = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Eval 3: Detectar obligatoriedad de cambiar contraseña provisoria
                    if (data.requirePasswordChange) {
                        Swal.fire({
                            title: 'Primer Ingreso Detectado',
                            text: 'Ha ingresado con una contraseña provisoria. Por motivos de seguridad, debe crear una nueva contraseña.',
                            icon: 'info',
                            input: 'password',
                            inputPlaceholder: 'Ingrese su nueva contraseña',
                            inputValidator: (value) => {
                                if (!value || value.length < 8) {
                                    return 'La contraseña debe tener al menos 8 caracteres.';
                                }
                            },
                            confirmButtonColor: '#8B1E28',
                            confirmButtonText: 'Actualizar Contraseña'
                        }).then(async (result) => {
                            if (result.isConfirmed) {
                                const respCambio = await fetch(`${API}/cambiar-clave-primer-ingreso`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ correo: data.correo, nuevaClave: result.value })
                                });
                                const dataCambio = await respCambio.json();
                                if (dataCambio.success) {
                                    Swal.fire('¡Éxito!', 'Contraseña actualizada. Inicie sesión nuevamente.', 'success');
                                }
                            }
                        });
                        return;
                    }

                    localStorage.setItem('sgr_user', JSON.stringify(data.usuario));
                    window.location.href = 'dashboard.html';
                } else {
                    Swal.fire({
                        title: 'Error de Autenticación',
                        text: data.message,
                        icon: 'error',
                        confirmButtonColor: '#8B1E28'
                    });
                }
            } catch (err) {
                Swal.fire({
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor backend.',
                    icon: 'error',
                    confirmButtonColor: '#8B1E28'
                });
            }
        });
    </script>
</body>
</html>
