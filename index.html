<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card glass-card p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h3 style="color: #8B1E28;" class="fw-bold">I. MUNICIPALIDAD DE LA SERENA</h3>
            <h6 class="text-muted">Gestión Territorial SGR</h6>
        </div>
        
        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario o Correo *</label>
                <input type="text" class="form-control" id="userInput" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña *</label>
                <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required>
            </div>
            <div class="text-end mb-4">
                <a href="recuperar.html" class="text-decoration-none small" style="color: #8B1E28;">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn btn-muni w-100 py-2 fs-6">Acceder al Sistema</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const usuario = document.getElementById('userInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!usuario || !password) {
                Swal.fire({
                    title: 'Campos incompletos',
                    text: 'Debe ingresar su usuario/correo y contraseña.',
                    icon: 'warning',
                    confirmButtonColor: '#8B1E28'
                });
                return;
            }

            try {
                const response = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('sgr_user', JSON.stringify(data.usuario));
                    sessionStorage.setItem('sgr_user', JSON.stringify(data.usuario));

                    Swal.fire({
                        title: `¡Bienvenido, ${data.usuario.nombre}!`,
                        text: `Rol: ${data.usuario.rol} | Delegación: ${data.usuario.delegacion}`,
                        icon: 'success',
                        timer: 1400,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    Swal.fire({
                        title: 'Acceso Denegado',
                        text: data.message,
                        icon: 'error',
                        confirmButtonColor: '#8B1E28'
                    });
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor Backend. Verifique que node server.js esté iniciado.',
                    icon: 'error',
                    confirmButtonColor: '#8B1E28'
                });
            }
        });
    </script>
</body>
</html>
