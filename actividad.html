<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-muni shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">Muni La Serena</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">📊 Gestión Territorial</a></li>
                    <li class="nav-item"><a class="nav-link active" href="actividad.html">📝 Registrar Requerimiento</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="validar.html">📸 Validar Evidencias</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="reportes.html">📥 Reportes</a></li>
                </ul>
                <div class="d-flex"><a href="index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a></div>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 650px;">
        <div class="card glass-card p-4 shadow-sm">
            <h3 class="mb-4 text-center" style="color: #8B1E28;">Registrar Nuevo Requerimiento</h3>
            
            <form id="actForm" class="needs-validation" novalidate>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Delegación Afectada *</label>
                        <select class="form-select" required>
                            <option value="" selected disabled>Seleccione...</option>
                            <option>Avenida del Mar</option>
                            <option>Centro</option>
                            <option>La Antena / La Florida</option>
                            <option>Las Compañías</option>
                            <option>La Pampa</option>
                            <option>Rural</option>
                        </select>
                        <div class="invalid-feedback">Seleccione un territorio.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Fecha del Suceso *</label>
                        <input type="date" class="form-control" required>
                        <div class="invalid-feedback">Ingrese una fecha.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción del Problema o Necesidad *</label>
                    <textarea class="form-control" rows="3" required minlength="15" placeholder="Ej: Deterioro de espacio público en..."></textarea>
                    <div class="invalid-feedback">Debe describir la situación (Mínimo 15 caracteres).</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Evidencia Fotográfica (Terreno)</label>
                    <input type="file" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-muni w-100 py-2">Guardar en el Sistema</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const formAct = document.getElementById('actForm');
        formAct.addEventListener('submit', function(event) {
            if (!formAct.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            } else {
                event.preventDefault();
                alert('¡Requerimiento registrado para la delegación seleccionada!');
                window.location.href = 'dashboard.html';
            }
            formAct.classList.add('was-validated');
        }, false);
    </script>
</body>
</html>
