<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Atención - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO DEL FORMULARIO -->
    <div class="container mt-5 mb-5" style="max-width: 850px;">
        <div class="card glass-card p-4 shadow-sm border-0">
            <h4 class="mb-4 text-center" style="color: #8B1E28;">Formulario de Ingreso de Atención</h4>
            
            <form id="formAtencion" class="needs-validation" novalidate>
                <!-- Fila 1: RUT, Nombre y Fecha -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">RUT Solicitante *</label>
                        <input type="text" class="form-control" id="rutSolicitante" placeholder="Ej: 15432890-1" pattern="^[0-9]+-[0-9Kk]$" required onblur="this.value = formatearRUT(this.value)">
                        <div class="invalid-feedback">Ingrese un RUT válido de vecino (Ej: 12345678-9).</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Nombre y Apellido *</label>
                        <input type="text" class="form-control" id="nombreSolicitante" placeholder="Ej: Juan Pérez" required>
                        <div class="invalid-feedback">El nombre es obligatorio.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Fecha de Registro *</label>
                        <input type="date" class="form-control bg-light" id="fechaRegistro" readonly required>
                    </div>
                </div>

                <!-- Fila 2: Delegación (Asignada por perfil) y Responsable -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Delegación de Atención *</label>
                        <input type="text" class="form-control bg-light" id="selectDelegacion" readonly style="background-color: #e9ecef;" required>
                        <small class="text-muted" style="font-size: 0.78rem;">Contexto asignado según el perfil del usuario en sesión.</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Usuario Responsable *</label>
                        <input type="text" class="form-control bg-light" id="inputResponsable" readonly style="background-color: #e9ecef;" required>
                    </div>
                </div>

                <!-- Fila 3: Tipo y Sub Atención Cargar desde BD -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tipo de Atención *</label>
                        <select class="form-select" id="tipoAtencion" required>
                            <option value="" selected disabled>Cargando tipos...</option>
                        </select>
                        <div class="invalid-feedback">Seleccione un tipo de atención.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Sub Atención *</label>
                        <select class="form-select" id="subAtencion" required disabled>
                            <option value="" selected disabled>Seleccione Tipo primero</option>
                        </select>
                        <div class="invalid-feedback">Seleccione una sub-atención.</div>
                    </div>
                </div>

                <!-- Fila 4: Descripción -->
                <div class="mb-4">
                    <label class="form-label fw-bold">Descripción del Requerimiento *</label>
                    <textarea class="form-control" id="descripcionRequerimiento" rows="3" required minlength="10" placeholder="Describa la solicitud y los antecedentes necesarios..."></textarea>
                    <div class="invalid-feedback">Debe ingresar una descripción de al menos 10 caracteres.</div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-3 justify-content-center mt-4">
                    <a href="dashboard.html" class="btn btn-secondary px-5 py-2">Cancelar</a>
                    <button type="submit" class="btn text-white px-5 py-2" style="background-color: #8B1E28;">Guardar atención</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let tiposAtencionBD = [];
        let subAtencionesBD = [];

        function formatearRUT(rut) {
            if (!rut) return '';
            let valor = rut.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length < 2) return valor;
            let cuerpo = valor.slice(0, -1);
            let dv = valor.slice(-1);
            return `${cuerpo}-${dv}`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const raw = localStorage.getItem('sgr_user') || sessionStorage.getItem('sgr_user');
            if (raw) {
                const usr = JSON.parse(raw);
                document.getElementById('inputResponsable').value = usr.nombre || usr.nombre_usuario || 'Operador';
                document.getElementById('selectDelegacion').value = (usr.delegacion || 'Sector Centro') + ' [Asignada por perfil]';
            }
            document.getElementById('fechaRegistro').valueAsDate = new Date();

            await cargarCatalogosAtencionBD();
        });

        async function cargarCatalogosAtencionBD() {
            try {
                const rawUser = JSON.parse(localStorage.getItem('sgr_user') || sessionStorage.getItem('sgr_user') || '{}');
                const userDelegacion = rawUser.delegacion || 'Sector Centro';

                const [resTipos, resSubs] = await Promise.all([
                    fetch(`${API}/tipos-atencion`, { credentials: 'include' }),
                    fetch(`${API}/sub-atenciones`, { credentials: 'include' })
                ]);

                const jsonTipos = await resTipos.json();
                const jsonSubs = await resSubs.json();

                if (jsonTipos.success) tiposAtencionBD = jsonTipos.datos;
                if (jsonSubs.success) subAtencionesBD = jsonSubs.datos;

                const selectTipo = document.getElementById('tipoAtencion');
                selectTipo.innerHTML = '<option value="" selected disabled>Seleccione Tipo...</option>';
                
                // FILTRADO DINÁMICO DE TIPOS POR DELEGACIÓN DEL USUARIO
                const tiposDisponibles = tiposAtencionBD.filter(t => 
                    t.estado === 'ACTIVO' && 
                    (!t.delegacion || t.delegacion.includes('Todas') || t.delegacion === userDelegacion)
                );

                tiposDisponibles.forEach(t => {
                    selectTipo.innerHTML += `<option value="${t.nombre}">${t.nombre}</option>`;
                });
            } catch (e) {
                console.error("Error al cargar categorías:", e);
            }
        }

        document.getElementById('tipoAtencion').addEventListener('change', function() {
            const subSel = document.getElementById('subAtencion');
            const tipoSeleccionado = this.value;
            subSel.innerHTML = '<option value="" selected disabled>Seleccione Sub Atención...</option>';
            
            // FILTRADO DE SUB ATENCIONES PERTENECIENTES AL TIPO SELECCIONADO
            const subsFiltradas = subAtencionesBD.filter(s => s.tipo_asociado === tipoSeleccionado && s.estado === 'ACTIVO');

            if(subsFiltradas.length > 0) {
                subsFiltradas.forEach(item => {
                    subSel.innerHTML += `<option value="${item.nombre}">${item.nombre}</option>`;
                });
                subSel.disabled = false;
            } else {
                subSel.disabled = true;
            }
        });

        document.getElementById('formAtencion').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let rutVal = document.getElementById('rutSolicitante').value.trim();
            rutVal = formatearRUT(rutVal);
            document.getElementById('rutSolicitante').value = rutVal;

            if (!this.checkValidity()) {
                e.stopPropagation();
                this.classList.add('was-validated');
                return;
            }
            this.classList.add('was-validated');

            const rawUser = JSON.parse(localStorage.getItem('sgr_user') || sessionStorage.getItem('sgr_user') || '{}');

            const datosAtencion = {
                rut: rutVal,
                solicitante: document.getElementById('nombreSolicitante').value.trim(),
                fecha_registro: document.getElementById('fechaRegistro').value,
                delegacion: rawUser.delegacion || 'Sector Centro',
                usuario_responsable: rawUser.nombre || rawUser.nombre_usuario || 'Operador',
                tipo_atencion: document.getElementById('tipoAtencion').value,
                sub_atencion: document.getElementById('subAtencion').value,
                descripcion: document.getElementById('descripcionRequerimiento').value.trim(),
                estado: 'PENDIENTE'
            };

            try {
                const btnSubmit = this.querySelector('button[type="submit"]');
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = 'Guardando... <span class="spinner-border spinner-border-sm"></span>';

                const response = await fetch(`${API}/atenciones`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(datosAtencion)
                });

                const result = await response.json();

                if (result.success) {
                    Swal.fire({
                        title: '¡Atención Registrada!',
                        text: 'La atención ha sido guardada en la base de datos.',
                        icon: 'success',
                        confirmButtonColor: '#8B1E28'
                    }).then(() => {
                        window.location.href = 'dashboard.html';
                    });
                } else {
                    Swal.fire('Error MySQL', result.message || 'No se pudo guardar la atención', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Guardar atención';
                }

            } catch (error) {
                console.error("Error:", error);
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
                const btnSubmit = this.querySelector('button[type="submit"]');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Guardar atención';
            }
        });
    </script>
</body>
</html>
