<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ítems y Metas - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 style="color: #8B1E28;" class="m-0 fw-bold">Ítems y Metas</h3>
                <p class="text-muted m-0">Administración de metas institucionales del municipio.</p>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-6">
                    <input type="text" id="busquedaItem" class="form-control" placeholder="Buscar por código, nombre o descripción..." oninput="filtrarItems(1)">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-success w-100" onclick="exportarExcelItems()">
                        Exportar Excel
                    </button>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn text-white w-100" style="background-color: #8B1E28;" onclick="modalNuevoItem()">
                        + Nuevo Ítem / Meta
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyItems">
                        <tr><td colspan="5" class="text-center">Cargando ítems desde MySQL...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- PIE DE PAGINACIÓN -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="text-muted small fw-bold" id="infoPaginacionItems">
                    Mostrando 0 a 0 de 0 registros
                </div>
                <nav aria-label="Navegación de páginas">
                    <ul class="pagination pagination-sm m-0" id="paginadorItems">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let listaItems = [];
        let paginaActual = 1;
        const limitePorPagina = 5;

        document.addEventListener('DOMContentLoaded', () => {
            fetch('navbar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('navbar-container').innerHTML = html;
                    marcarBotonActivo();
                    sincronizarSesionYNavbar();
                });

            cargarItemsBD(1);
        });

        function marcarBotonActivo() {
            let pag = window.location.pathname.split("/").pop();
            if (!pag || pag === '') pag = 'items.html';

            const enlaces = document.querySelectorAll('#navPublicMenu .nav-link-item');
            enlaces.forEach(enlace => {
                if (enlace.getAttribute('href') === pag) {
                    enlace.classList.add('activo-fijo');
                } else {
                    enlace.classList.remove('activo-fijo');
                }
            });
        }

        async function sincronizarSesionYNavbar() {
            try {
                const response = await fetch(`${API}/sesion-actual?t=${new Date().getTime()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) {
                    window.location.href = 'index.html';
                    return;
                }

                const data = await response.json();

                if (data.success && data.usuario) {
                    const usr = data.usuario;
                    localStorage.setItem('sgr_user', JSON.stringify(usr));

                    const elNombre = document.getElementById('usrHeaderNombre');
                    const elRol = document.getElementById('usrHeaderRol');
                    if (elNombre) elNombre.textContent = usr.nombre || usr.nombre_usuario;
                    if (elRol) elRol.textContent = usr.rol;
                }
            } catch (error) {
                console.error('Error al sincronizar sesión:', error);
            }
        }

        async function cargarItemsBD(pagina = 1) {
            try {
                const response = await fetch(`${API}/items`, { credentials: 'include' });
                const json = await response.json();
                if (json.success) {
                    listaItems = json.datos.sort((a, b) => a.id_item - b.id_item);
                    filtrarItems(pagina);
                }
            } catch (error) { console.error(error); }
        }

        function filtrarItems(pagina = 1) {
            paginaActual = pagina;
            const texto = document.getElementById('busquedaItem').value.trim().toLowerCase();

            let filtrados = listaItems;
            if (texto !== '') {
                filtrados = listaItems.filter(i => 
                    i.codigo.toLowerCase().includes(texto) || 
                    i.nombre.toLowerCase().includes(texto) ||
                    (i.descripcion && i.descripcion.toLowerCase().includes(texto))
                );
            }

            const totalRegistros = filtrados.length;
            const totalPaginas = Math.ceil(totalRegistros / limitePorPagina) || 1;
            
            const inicio = (paginaActual - 1) * limitePorPagina;
            const fin = inicio + limitePorPagina;
            const datosPagina = filtrados.slice(inicio, fin);

            renderTablaItems(datosPagina);
            renderizarPaginador(totalRegistros, totalPaginas, totalRegistros > 0 ? inicio + 1 : 0, Math.min(fin, totalRegistros));
        }

        function renderTablaItems(datos) {
            const tbody = document.getElementById('tbodyItems');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay ítems o metas registrados.</td></tr>';
                return;
            }

            datos.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.codigo}</strong></td>
                    <td>${item.nombre}</td>
                    <td>${item.descripcion || 'Sin descripción'}</td>
                    <td><span class="badge ${item.estado === 'Vigente' ? 'bg-success' : 'bg-secondary'}">${item.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="modalEditarItem(${item.id_item})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarItem(${item.id_item})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarPaginador(totalRegistros, totalPaginas, desde, hasta) {
            const infoText = document.getElementById('infoPaginacionItems');
            const ulPaginador = document.getElementById('paginadorItems');

            if (totalRegistros === 0) {
                infoText.textContent = 'Mostrando 0 a 0 de 0 registros';
                ulPaginador.innerHTML = '';
                return;
            } else {
                infoText.textContent = `Mostrando ${desde} a ${hasta} de ${totalRegistros} registros`;
            }

            ulPaginador.innerHTML = '';

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarItems(${paginaActual - 1})">Anterior</button>
                </li>
            `;

            for (let i = 1; i <= totalPaginas; i++) {
                ulPaginador.innerHTML += `
                    <li class="page-item ${i === paginaActual ? 'active' : ''}">
                        <button class="page-link" ${i === paginaActual ? 'style="background-color: #8B1E28; border-color: #8B1E28;"' : ''} onclick="filtrarItems(${i})">${i}</button>
                    </li>
                `;
            }

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarItems(${paginaActual + 1})">Siguiente</button>
                </li>
            `;
        }

        function modalNuevoItem() {
            Swal.fire({
                title: 'Nuevo Ítem / Meta',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código (Opcional)</label>
                            <input id="sw-item-codigo" class="form-control" placeholder="Ej: MET-2026-02 (Dejar vacío para automático)">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-item-nombre" class="form-control" placeholder="Ej: Reducción Tiempos de Espera">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Descripción</label>
                            <input id="sw-item-desc" class="form-control" placeholder="Descripción de la meta">
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar Meta',
                preConfirm: () => {
                    const codigoInput = document.getElementById('sw-item-codigo').value.trim();
                    const nombre = document.getElementById('sw-item-nombre').value.trim();
                    if (!nombre) {
                        Swal.showValidationMessage('Ingresa el Nombre de la meta.');
                        return false;
                    }
                    return {
                        codigo: codigoInput,
                        nombre,
                        descripcion: document.getElementById('sw-item-desc').value.trim() || 'Sin descripción',
                        estado: 'Vigente'
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/items`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Guardado!', `Meta registrada con éxito (${json.codigo}).`, 'success');
                        cargarItemsBD(paginaActual);
                    } else {
                        Swal.fire('Error', json.message, 'error');
                    }
                }
            });
        }

        function modalEditarItem(id) {
            const item = listaItems.find(i => i.id_item === id);
            if (!item) return;

            Swal.fire({
                title: `Editar Meta #${id}`,
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-edit-item-codigo" class="form-control" value="${item.codigo}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-edit-item-nombre" class="form-control" value="${item.nombre}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Descripción</label>
                            <input id="sw-edit-item-desc" class="form-control" value="${item.descripcion || ''}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-edit-item-est" class="form-select">
                                <option value="Vigente" ${item.estado === 'Vigente' ? 'selected' : ''}>Vigente</option>
                                <option value="Finalizada" ${item.estado === 'Finalizada' ? 'selected' : ''}>Finalizada</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Actualizar',
                preConfirm: () => {
                    return {
                        codigo: document.getElementById('sw-edit-item-codigo').value.trim(),
                        nombre: document.getElementById('sw-edit-item-nombre').value.trim(),
                        descripcion: document.getElementById('sw-edit-item-desc').value.trim(),
                        estado: document.getElementById('sw-edit-item-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await fetch(`${API}/items/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    Swal.fire('¡Actualizado!', 'Meta actualizada.', 'success');
                    cargarItemsBD(paginaActual);
                }
            });
        }

        async function eliminarItem(id) {
            Swal.fire({
                title: '¿Eliminar Meta?',
                text: 'Se eliminará de la base de datos.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Eliminar'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await fetch(`${API}/items/${id}`, { method: 'DELETE', credentials: 'include' });
                    cargarItemsBD(paginaActual);
                }
            });
        }

        function exportarExcelItems() {
            let csv = 'Codigo,Nombre,Descripcion,Estado\n';
            listaItems.forEach(i => {
                csv += `"${i.codigo}","${i.nombre}","${i.descripcion || ''}","${i.estado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Items_Metas.csv';
            a.click();
        }
    </script>
</body>
</html>
