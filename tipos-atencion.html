<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Atención - Muni La Serena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100" style="background-color: #f4f6f9;">

    <!-- NAVBAR CENTRALIZADO -->
    <div id="navbar-container"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3 style="color: #8B1E28;" class="m-0 fw-bold">Tipos de Atención</h3>
                <p class="text-muted m-0">Catálogo general de categorías de atención municipal ligadas a delegaciones.</p>
            </div>
        </div>

        <div class="card p-3 shadow-sm border-0">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-5">
                    <input type="text" id="busquedaTipo" class="form-control" placeholder="Buscar por nombre, código u otro campo..." oninput="filtrarTipos(1)">
                </div>
                <div class="col-md-3">
                    <select id="filtroEstadoTipo" class="form-select" onchange="filtrarTipos(1)">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO">ACTIVO</option>
                        <option value="INACTIVO">INACTIVO</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-success w-100" onclick="exportarExcelTipos()">
                        Exportar Excel
                    </button>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn text-white w-100" style="background-color: #8B1E28;" onclick="modalNuevoTipo()">
                        + Nuevo registro
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Delegación Ligada</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyTipos">
                        <tr><td colspan="6" class="text-center">Cargando tipos de atención...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                <div class="text-muted small fw-bold" id="infoPaginacionTipos">
                    Mostrando 0 a 0 de 0 registros
                </div>
                <nav aria-label="Navegación de páginas">
                    <ul class="pagination pagination-sm m-0" id="paginadorTipos">
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="navbar.js"></script>
    <script>
        const API = window.location.protocol.startsWith('http') 
            ? `${window.location.origin}/api` 
            : 'http://localhost:3000/api';

        let listaTipos = [];
        let listaDelegacionesCat = [];
        let paginaActual = 1;
        const limitePorPagina = 5;

        document.addEventListener('DOMContentLoaded', async () => {
            fetch('navbar.html')
                .then(res => res.text())
                .then(html => {
                    document.getElementById('navbar-container').innerHTML = html;
                    marcarBotonActivo();
                    sincronizarSesionYNavbar();
                });

            await cargarDelegacionesCatalogo();
            cargarTiposBD(1);
        });

        function marcarBotonActivo() {
            let pag = window.location.pathname.split("/").pop();
            if (!pag || pag === '') pag = 'tipos-atencion.html';

            const enlaces = document.querySelectorAll('#navPublicMenu .nav-link-item');
            enlaces.forEach(enlace => {
                if (enlace.getAttribute('href') === pag) {
                    enlace.classList.add('activo-fijo');
                } else {
                    enlace.classList.remove('activo-fijo');
                }
            });
        }

        async function sincronizarSesionYNavbar() {
            try {
                const response = await fetch(`${API}/sesion-actual?t=${new Date().getTime()}`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.usuario) {
                        const usr = data.usuario;
                        localStorage.setItem('sgr_user', JSON.stringify(usr));

                        const elNombre = document.getElementById('usrHeaderNombre');
                        const elRol = document.getElementById('usrHeaderRol');
                        if (elNombre) elNombre.textContent = usr.nombre || usr.nombre_usuario;
                        if (elRol) elRol.textContent = usr.rol;
                    }
                }
            } catch (error) {
                console.error('Error al sincronizar sesión:', error);
            }
        }

        async function cargarDelegacionesCatalogo() {
            try {
                const res = await fetch(`${API}/delegaciones?limit=100`, { credentials: 'include' });
                const json = await res.json();
                if (json.success) listaDelegacionesCat = json.datos;
            } catch (e) { console.error(e); }
        }

        async function cargarTiposBD(pagina = 1) {
            paginaActual = pagina;
            try {
                const response = await fetch(`${API}/tipos-atencion`, { credentials: 'include' });
                const json = await response.json();
                if (json.success) {
                    // Ordenamiento por el número del código (TAT-01, TAT-02, etc.)
                    listaTipos = json.datos.sort((a, b) => {
                        const numA = parseInt((a.codigo ? a.codigo.match(/\d+/) : [0]) || [0], 10);
                        const numB = parseInt((b.codigo ? b.codigo.match(/\d+/) : [0]) || [0], 10);
                        return numA - numB;
                    });
                    filtrarTipos(paginaActual);
                }
            } catch (error) { console.error(error); }
        }

        function filtrarTipos(pagina = 1) {
            paginaActual = pagina;
            const texto = document.getElementById('busquedaTipo').value.toLowerCase();
            const estado = document.getElementById('filtroEstadoTipo').value;

            const filtrados = listaTipos.filter(t => {
                const coincideTexto = t.nombre.toLowerCase().includes(texto) || t.codigo.toLowerCase().includes(texto);
                const coincideEstado = estado === '' || t.estado === estado;
                return coincideTexto && coincideEstado;
            });

            const totalRegistros = filtrados.length;
            const totalPaginas = Math.ceil(totalRegistros / limitePorPagina) || 1;
            
            const inicio = (paginaActual - 1) * limitePorPagina;
            const fin = inicio + limitePorPagina;
            const datosPagina = filtrados.slice(inicio, fin);

            renderTablaTipos(datosPagina);
            renderizarPaginador(totalRegistros, totalPaginas, totalRegistros > 0 ? inicio + 1 : 0, Math.min(fin, totalRegistros));
        }

        function renderTablaTipos(datos) {
            const tbody = document.getElementById('tbodyTipos');
            tbody.innerHTML = '';

            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No hay tipos registrados.</td></tr>';
                return;
            }

            datos.forEach(t => {
                const idReal = t.id_tipo || t.id_tipo_atencion;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${t.codigo}</strong></td>
                    <td>${t.nombre}</td>
                    <td>${t.descripcion || 'Sin descripción'}</td>
                    <td><span class="badge bg-secondary">${t.delegacion || 'Todas (Comunal)'}</span></td>
                    <td><span class="badge ${t.estado === 'ACTIVO' ? 'bg-success' : 'bg-secondary'}">${t.estado}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="modalEditarTipo(${idReal})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarTipo(${idReal})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderizarPaginador(totalRegistros, totalPaginas, desde, hasta) {
            const infoText = document.getElementById('infoPaginacionTipos');
            const ulPaginador = document.getElementById('paginadorTipos');

            if (totalRegistros === 0) {
                infoText.textContent = 'Mostrando 0 a 0 de 0 registros';
                ulPaginador.innerHTML = '';
                return;
            } else {
                infoText.textContent = `Mostrando ${desde} a ${hasta} de ${totalRegistros} registros`;
            }

            ulPaginador.innerHTML = '';

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === 1 ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarTipos(${paginaActual - 1})">Anterior</button>
                </li>
            `;

            for (let i = 1; i <= totalPaginas; i++) {
                ulPaginador.innerHTML += `
                    <li class="page-item ${i === paginaActual ? 'active' : ''}">
                        <button class="page-link" ${i === paginaActual ? 'style="background-color: #8B1E28; border-color: #8B1E28;"' : ''} onclick="filtrarTipos(${i})">${i}</button>
                    </li>
                `;
            }

            ulPaginador.innerHTML += `
                <li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}">
                    <button class="page-link" onclick="filtrarTipos(${paginaActual + 1})">Siguiente</button>
                </li>
            `;
        }

        function modalNuevoTipo() {
            let opcionesDel = `<option value="Todas (Comunal)">Todas (Comunal)</option>`;
            listaDelegacionesCat.forEach(d => {
                opcionesDel += `<option value="${d.nombre}">${d.nombre}</option>`;
            });

            Swal.fire({
                title: 'Nuevo Tipo de Atención',
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código (Opcional - Autogenerado)</label>
                            <input id="sw-ta-codigo" class="form-control" placeholder="Ej: TAT-04 (Dejar vacío para correlativo automático)">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-ta-nombre" class="form-control" placeholder="Ej: Asistencia Social, Obras">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Delegación *</label>
                            <select id="sw-ta-del" class="form-select">
                                ${opcionesDel}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Descripción</label>
                            <input id="sw-ta-desc" class="form-control" placeholder="Descripción breve">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-ta-est" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Guardar',
                preConfirm: () => {
                    const codigoInput = document.getElementById('sw-ta-codigo').value.trim();
                    const nombre = document.getElementById('sw-ta-nombre').value.trim();
                    if (!nombre) {
                        Swal.showValidationMessage('El Nombre es obligatorio.');
                        return false;
                    }
                    return {
                        codigo: codigoInput,
                        nombre,
                        delegacion: document.getElementById('sw-ta-del').value,
                        descripcion: document.getElementById('sw-ta-desc').value.trim() || 'Sin descripción',
                        estado: document.getElementById('sw-ta-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/tipos-atencion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Guardado!', `Tipo de atención agregado (${json.codigo}).`, 'success');
                        cargarTiposBD(paginaActual);
                    } else {
                        Swal.fire('Error', json.message, 'error');
                    }
                }
            });
        }

        function modalEditarTipo(id) {
            const t = listaTipos.find(item => (item.id_tipo || item.id_tipo_atencion) === id);
            if (!t) return;

            let opcionesDel = `<option value="Todas (Comunal)" ${(!t.delegacion || t.delegacion.includes('Todas')) ? 'selected' : ''}>Todas (Comunal)</option>`;
            listaDelegacionesCat.forEach(d => {
                opcionesDel += `<option value="${d.nombre}" ${t.delegacion === d.nombre ? 'selected' : ''}>${d.nombre}</option>`;
            });

            Swal.fire({
                title: `Editar Tipo de Atención #${id}`,
                html: `
                    <div class="text-start" style="font-size: 0.9rem;">
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Código *</label>
                            <input id="sw-edit-ta-codigo" class="form-control" value="${t.codigo}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Nombre *</label>
                            <input id="sw-edit-ta-nombre" class="form-control" value="${t.nombre}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Delegación *</label>
                            <select id="sw-edit-ta-del" class="form-select">
                                ${opcionesDel}
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Descripción</label>
                            <input id="sw-edit-ta-desc" class="form-control" value="${t.descripcion || ''}">
                        </div>
                        <div class="mb-2">
                            <label class="fw-bold mb-1">Estado</label>
                            <select id="sw-edit-ta-est" class="form-select">
                                <option value="ACTIVO" ${t.estado === 'ACTIVO' ? 'selected' : ''}>ACTIVO</option>
                                <option value="INACTIVO" ${t.estado === 'INACTIVO' ? 'selected' : ''}>INACTIVO</option>
                            </select>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonColor: '#8B1E28',
                confirmButtonText: 'Actualizar',
                preConfirm: () => {
                    const codigo = document.getElementById('sw-edit-ta-codigo').value.trim();
                    const nombre = document.getElementById('sw-edit-ta-nombre').value.trim();
                    if (!codigo || !nombre) {
                        Swal.showValidationMessage('El Código y Nombre son obligatorios.');
                        return false;
                    }
                    return {
                        codigo,
                        nombre,
                        delegacion: document.getElementById('sw-edit-ta-del').value,
                        descripcion: document.getElementById('sw-edit-ta-desc').value.trim(),
                        estado: document.getElementById('sw-edit-ta-est').value
                    };
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    const res = await fetch(`${API}/tipos-atencion/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify(result.value)
                    });
                    const json = await res.json();
                    if (json.success) {
                        Swal.fire('¡Actualizado!', 'Tipo modificado correctamente.', 'success');
                        cargarTiposBD(paginaActual);
                    } else {
                        Swal.fire('Error', json.message, 'error');
                    }
                }
            });
        }

        async function eliminarTipo(id) {
            Swal.fire({
                title: '¿Eliminar Tipo de Atención?',
                text: 'Se validará la integridad referencial antes de eliminar.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Eliminar'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    const response = await fetch(`${API}/tipos-atencion/${id}`, { method: 'DELETE', credentials: 'include' });
                    const json = await response.json();
                    if (json.success) {
                        Swal.fire('¡Eliminado!', 'Registro removido.', 'success');
                        cargarTiposBD(paginaActual);
                    } else {
                        Swal.fire('Operación Bloqueada', json.message, 'error');
                    }
                }
            });
        }

        function exportarExcelTipos() {
            let csv = 'Codigo,Nombre,Delegacion,Descripcion,Estado\n';
            listaTipos.forEach(t => {
                csv += `"${t.codigo}","${t.nombre}","${t.delegacion || 'Todas'}","${t.descripcion || ''}","${t.estado}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Tipos_Atencion.csv';
            a.click();
        }
    </script>
</body>
</html>
